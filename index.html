<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Docker Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 80px auto; padding: 20px; }
    .box { padding: 30px; border-radius: 12px; box-shadow: 0 2px 12px #ccc; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; cursor: pointer; }

</head>
<body>
  <div class="box">
    <h1>Restaurant Management System</h1>

      Test Application
    </button>
  </div>
</body>
</html>
